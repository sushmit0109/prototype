name: e-GP — refresh procurement tracker

# The awards list is sorted newest-first and updates continuously (contracts
# get signed across the country every day), so a daily check is the right
# cadence -- unlike crime-bd's twice-a-month sheet or electricity's hourly
# feed. 20:00 UTC is after the Bangladesh working day (Asia/Dhaka is UTC+6).
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Re-crawl the entire eContracts/tenders lists instead of just what's new (slow, ~600-900 pages each)"
        type: boolean
        default: false
      ownership_sample_size:
        description: "How many of the largest vendors to have ownership data for (grows incrementally, resumable)"
        type: string
        default: "20000"

permissions:
  contents: write

concurrency:
  group: e-gp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-gp/pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debarment register (re-crawled in full -- ~1,000 records, cheap)
        run: python3 scrape_debarment.py ../raw/debarments.jsonl

      - name: CPV category mix (re-crawled in full -- 61 lightweight count requests)
        run: |
          python3 scrape_cpv.py ../raw/cpv_categories.json
          python3 build_cpv.py ../raw/cpv_categories.json ../data/cpv_categories.json

      - name: Annual Procurement Plans (re-crawled in full -- ~46K records across 18 FYs, cheap)
        run: python3 scrape_app.py ../raw/app_plans.jsonl

      - name: eExperience / eCMS (re-crawled in full -- ~186K records)
        # Gzipped immediately: the plain file is ~150MB, well over GitHub's
        # 100MB per-file push limit; gzipped it's ~24MB. build_ecms.py reads
        # either transparently.
        run: |
          python3 scrape_ecms.py ../raw/ecms.jsonl
          gzip -f ../raw/ecms.jsonl

      - name: Known contract/tender IDs so far (for incremental crawls)
        if: ${{ !inputs.full_backfill }}
        run: |
          python3 -c "
          import glob, gzip, json

          def ids(pattern, field):
              out = set()
              for path in glob.glob(pattern):
                  opener = gzip.open if path.endswith('.gz') else open
                  with opener(path, 'rt') as fh:
                      out.update(json.loads(l)[field] for l in fh)
              return out

          contract_ids = ids('../raw/contracts/*.jsonl*', 'tender_id')
          open('/tmp/known_contract_ids.txt', 'w').write('\n'.join(contract_ids))
          print(len(contract_ids), 'known contract tender IDs')

          tender_ids = ids('../raw/tenders/*.jsonl*', 'tender_id')
          open('/tmp/known_tender_ids.txt', 'w').write('\n'.join(tender_ids))
          print(len(tender_ids), 'known master-list tender IDs')
          "

      - name: eContracts -- incremental
        if: ${{ !inputs.full_backfill }}
        run: python3 scrape_noa.py "../raw/contracts/incoming_$(date -u +%F).jsonl" --stop-known=/tmp/known_contract_ids.txt

      - name: eContracts -- full backfill (manual trigger only)
        if: ${{ inputs.full_backfill }}
        run: python3 scrape_noa.py "../raw/contracts/backfill_$(date -u +%F).jsonl"

      - name: Master tender list -- incremental
        if: ${{ !inputs.full_backfill }}
        run: python3 scrape_tenders.py "../raw/tenders/incoming_$(date -u +%F).jsonl" --stop-known=/tmp/known_tender_ids.txt

      - name: Master tender list -- full backfill (manual trigger only)
        if: ${{ inputs.full_backfill }}
        run: python3 scrape_tenders.py "../raw/tenders/backfill_$(date -u +%F).jsonl"

      - name: Build contracts, tenders, debarments, APP, eCMS
        run: |
          python3 build_site.py ../raw/debarments.jsonl ../data/debarments.json
          python3 build_contracts.py ../raw/contracts ../data/contracts
          python3 build_tenders.py ../raw/tenders ../data/tenders
          python3 build_app.py ../raw/app_plans.jsonl ../data/app_plans.json
          python3 build_ecms.py ../raw/ecms.jsonl.gz ../data/ecms
          python3 flag_debarred_awards.py ../data/debarments.json ../data/contracts ../data/flags.json
          python3 build_insights.py ../data/contracts ../data/insights.json ../data/tenders
          python3 build_office_profiles.py ../data/contracts ../data/tenders ../data/office_profiles.json
          python3 build_analysis.py ../data/contracts ../data/tenders ../data/analysis.json
          python3 build_ceiling.py ../data/contracts ../data/ceiling.json
          python3 build_geo.py ../data/contracts ../data/geo.json

      - name: Itemised APP -- extend coverage of the pre-tender estimates (resumable)
        # Busiest offices first, so a run cut short still covers the packages
        # that matter. Gzipped for the same reason as eCMS: the plain file
        # runs past GitHub's 100MB per-file limit.
        run: |
          if [ -f ../raw/app_items.jsonl.gz ]; then gunzip -f ../raw/app_items.jsonl.gz; fi
          python3 scrape_app_items.py ../raw/app_plans.jsonl ../raw/app_items.jsonl --limit=1200 --resume
          python3 build_plan_vs_actual.py ../raw/app_items.jsonl ../data/contracts ../data/plan_vs_actual.json
          gzip -f ../raw/app_items.jsonl

      - name: Ownership -- sample new/updated top vendors (resumable, largest first)
        run: |
          python3 pick_vendor_samples.py ../data/contracts /tmp/vendor_samples.jsonl --limit=${{ inputs.ownership_sample_size || 20000 }}
          python3 scrape_award_details.py /tmp/vendor_samples.jsonl ../raw/award_details.jsonl --resume
          python3 build_ownership.py ../raw/award_details.jsonl ../data/ownership.json

      - name: Commit if anything changed
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e-gp
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            COUNTS=$(python3 <<'PYEOF'
          import json
          f = json.load(open('e-gp/data/flags.json'))
          o = json.load(open('e-gp/data/ownership.json'))
          print(f"{f['meta']['contracts_scanned']} contracts, {f['meta']['flag_count']} flags, {o['meta']['vendors_sampled']} vendors with ownership data")
          PYEOF
          )
            git commit -m "e-gp: refresh $(date -u +%F) -- $COUNTS"
            git push
          fi
