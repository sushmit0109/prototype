name: Electricity dashboard — hourly update

on:
  schedule:
    # :17 past the hour, not :00 — the sources are slow on the hour and every
    # scheduled job on GitHub piles onto :00.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Run a deeper backfill (slower)'
        type: boolean
        default: false

concurrency:
  group: electricity-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: electricity/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r electricity/pipeline/requirements.txt

      # Each scraper is allowed to fail without killing the run: one source
      # being down should still let the others refresh the page.
      - name: PGCB hourly demand / supply / load-shed
        working-directory: electricity/pipeline
        continue-on-error: true
        run: python scrape_pgcb.py --pages ${{ inputs.backfill && '400' || '4' }}

      - name: BPDB area-wise demand
        working-directory: electricity/pipeline
        continue-on-error: true
        run: python scrape_areawise.py --days ${{ inputs.backfill && '400' || '5' }}

      - name: BPDB archive index
        working-directory: electricity/pipeline
        continue-on-error: true
        run: python scrape_bpdb_index.py --pages ${{ inputs.backfill && '80' || '2' }}

      - name: Parse NLDC daily PDFs
        working-directory: electricity/pipeline
        continue-on-error: true
        run: python parse_bpdb_pdf.py --recent ${{ inputs.backfill && '400' || '6' }}

      - name: Rebuild site data
        working-directory: electricity/pipeline
        run: python build_site.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A electricity/data electricity/raw
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "electricity: hourly data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have landed while this one was working.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"
