<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangladesh Census Dashboard</title>
<meta http-equiv="refresh" content="0; url=https://bbs-census.vercel.app/">
<link rel="canonical" href="https://bbs-census.vercel.app/">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2e3350;
    --accent: #4fc3a1;
    --text: #e8eaf6;
    --muted: #8890b0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .box {
    max-width: 420px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back { display: block; margin-top: 20px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Redirecting to the Census Dashboard…</h1>
    <p>
      This prototype now runs on its own deployment.
      If you're not redirected automatically, <a href="https://bbs-census.vercel.app/">continue to bbs-census.vercel.app →</a>
    </p>
    <a class="back" href="../">← All prototypes</a>
  </div>
  <script>
    location.replace("https://bbs-census.vercel.app/");
  </script>
</body>
</html>
